<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Weekend Event – Map</title>
  <link rel="stylesheet" href="css/site-nav.css" />
  <style>
    body.map-page {
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      background: radial-gradient(ellipse at center, #12121f 0%, #05050a 100%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #map { width: 100%; height: 100%; display: block; }
    .stars circle { fill: #fff; opacity: 0.35; }
    .link { stroke: #5a5a70; stroke-width: 2; }
    .node { cursor: pointer; }
    .node circle.main { fill: #1a1a28; stroke: var(--node); stroke-width: 3; }
    .node.selected circle.main { filter: drop-shadow(0 0 10px var(--accent)); }
    .node text.type {
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node text.label {
      font-size: 12px;
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
    }
    .map-hint {
      position: absolute;
      bottom: 0.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(10, 10, 18, 0.75);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }
    #add-node {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      z-index: 6;
    }
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 72dvh;
      overflow: auto;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 0.75rem 0.9rem calc(0.9rem + var(--safe-bottom));
      transform: translateY(110%);
      transition: transform 0.2s ease;
      z-index: 30;
    }
    .sheet.open { transform: translateY(0); }
    .sheet h2 { margin: 0 2rem 0.6rem 0; font-size: 1.15rem; }
    .close-btn {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 44px;
      background: transparent;
      color: var(--text);
      border: 0;
    }
    .meta { display: grid; grid-template-columns: 6.5rem 1fr; gap: 0.35rem 0.6rem; }
    .meta dt { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .meta dd { margin: 0; }
  </style>
</head>
<body class="map-page">
  <header class="site-header">
    <div class="site-header-inner">
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <a class="brand" href="index.html">
        <span class="titles">
          <span class="brand-kicker">Narrative map</span>
          <h1>Map</h1>
        </span>
      </a>
      <div class="header-end">
        <span id="nav-auth"><a class="nav-login" href="login.html">Log in</a></span>
      </div>
    </div>
    <nav class="site-nav" id="site-menu">
      <a href="index.html">Home</a>
      <a href="campaign_map.html">Map</a>
      <a href="games.html">Results</a>
      <a href="systems.html" data-role="campaign_admin">Nodes</a>
      <button type="button" id="nav-logout" hidden>Log out</button>
    </nav>
  </header>
  <div class="map-wrap" id="map-wrap">
    <div class="map-alert" id="map-alert" hidden></div>
    <button type="button" id="add-node" hidden>Add node</button>
    <svg id="map" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Node and route map">
      <g class="stars" id="stars"></g>
      <g id="links"></g>
      <g id="nodes"></g>
    </svg>
    <div class="map-hint" id="map-hint">Pinch to zoom · Drag to pan · Double-tap to reset</div>
  </div>
  <div class="sheet" id="sheet">
    <button type="button" class="close-btn" id="close-sheet" aria-label="Close">×</button>
    <h2 id="sheet-title">Node</h2>
    <p class="empty" id="empty-msg">Tap a node on the map.</p>
    <div id="detail" hidden>
      <div id="node-view"></div>
      <form id="node-form" class="form-grid" hidden>
        <label class="field">Name
          <input name="sys_name" required maxlength="80" />
        </label>
        <div class="two">
          <label class="field">X
            <input name="sys_x" inputmode="decimal" />
          </label>
          <label class="field">Y
            <input name="sys_y" inputmode="decimal" />
          </label>
        </div>
        <div class="field">Routes
          <div id="route-picks" class="check-list"></div>
        </div>
        <label class="field">Notes
          <textarea name="sys_notes" maxlength="500"></textarea>
        </label>
        <div class="button-row">
          <button type="submit">Save node</button>
          <button type="button" class="danger" id="delete-node">Delete</button>
        </div>
        <p id="node-msg" class="msg" role="status"></p>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script>SH.applyNavPermissions();</script>
</body>
</html>
