<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Weekend Event – Results</title>
  <link rel="stylesheet" href="css/site-nav.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <a class="brand" href="index.html">
        <span class="titles">
          <span class="brand-kicker">Narrative map</span>
          <h1>Results</h1>
        </span>
      </a>
      <div class="header-end">
        <span id="nav-auth"><a class="nav-login" href="login.html">Log in</a></span>
      </div>
    </div>
    <nav class="site-nav" id="site-menu">
      <a href="index.html">Home</a>
      <a href="area-map.html">Map</a>
      <a href="games.html">Results</a>
      <a href="roster.html">Roster</a>
      <a href="pairings.html">Pairings</a>
      <a href="standings.html">Standings</a>
      <a href="narrative.html">Log</a>
      <a href="map-editor.html" data-role="campaign_admin">Edit map</a>
      <a href="campaign_map.html" data-role="campaign_admin">Node map</a>
      <a href="systems.html" data-role="campaign_admin">Nodes</a>
      <button type="button" id="nav-logout" hidden>Log out</button>
    </nav>
  </header>
  <main class="page">
    <p class="lede">Confirmed results show display names, factions, and armies. A report stays hidden until both players agree or the organiser confirms it.</p>
    <div id="queue-wrap" data-role="campaign_admin" hidden>
      <h2>To review</h2>
      <div id="queue" class="stack"></div>
      <form id="editor" class="card form-grid" hidden style="margin-top:0.9rem">
        <h2 id="editor-title">Edit result</h2>
        <label class="field">Loyalist VP
          <input id="edit-loyal" inputmode="numeric" />
        </label>
        <label class="field">Traitor VP
          <input id="edit-traitor" inputmode="numeric" />
        </label>
        <label class="field">Note
          <textarea id="edit-note" maxlength="240"></textarea>
        </label>
        <div class="button-row">
          <button type="submit">Save</button>
          <button type="button" class="ghost" id="confirm">Confirm</button>
          <button type="button" class="danger" id="reject">Reject</button>
        </div>
        <p id="edit-msg" class="msg" role="status"></p>
      </form>
    </div>
    <div id="list" class="stack" style="margin-top:0.9rem"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/results-board.js"></script>
  <script>SH.applyNavPermissions();</script>
</body>
</html>
