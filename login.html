<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Weekend Event – Admin login</title>
  <link rel="stylesheet" href="css/site-nav.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <a class="brand" href="index.html">
        <span class="titles">
          <span class="brand-kicker">Narrative map</span>
          <h1 data-event-name>Weekend Event</h1>
        </span>
      </a>
      <div class="header-end">
        <span id="nav-auth"><a class="nav-login" href="login.html">Log in</a></span>
      </div>
    </div>
    <nav class="site-nav" id="site-menu">
      <a href="index.html">Home</a>
      <a href="area-map.html">Map</a>
      <a href="games.html">Results</a>
      <a href="roster.html">Roster</a>
      <a href="map-editor.html" data-role="campaign_admin">Edit map</a>
      <a href="campaign_map.html" data-role="campaign_admin">Node map</a>
      <a href="systems.html" data-role="campaign_admin">Nodes</a>
      <button type="button" id="nav-logout" hidden>Log out</button>
    </nav>
  </header>
  <main class="page">
    <h2 style="margin:0 0 0.4rem">Admin login</h2>
    <p class="lede">Players do not have accounts. Only the event admin signs in. Results will later be reported with an event code and a round QR code.</p>
    <form id="login-form" class="card form-grid">
      <label class="field">Username
        <input name="login" autocomplete="username" required />
      </label>
      <label class="field">Password
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
      <p id="login-msg" class="msg" role="status"></p>
    </form>
    <form id="password-form" class="card form-grid" hidden style="margin-top:0.75rem">
      <h2>Change password</h2>
      <label class="field">Current password
        <input name="current_password" type="password" autocomplete="current-password" required />
      </label>
      <label class="field">New password
        <input name="password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <button type="submit">Update password</button>
      <p id="password-msg" class="msg" role="status"></p>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const passwordForm = document.getElementById("password-form");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("login-msg");
      msg.className = "msg";
      msg.textContent = "Signing in…";
      try {
        await SH.login({
          login: loginForm.login.value.trim(),
          password: loginForm.password.value
        });
        location.href = "index.html";
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message || "Could not sign in";
      }
    });
    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("password-msg");
      msg.className = "msg";
      msg.textContent = "Updating…";
      try {
        await SH.setPassword({
          current_password: passwordForm.current_password.value,
          password: passwordForm.password.value
        });
        passwordForm.reset();
        msg.className = "msg ok";
        msg.textContent = "Password updated";
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message || "Could not update the password";
      }
    });
    SH.applyNavPermissions().then(() => {
      if (SH.isLoggedIn()) {
        loginForm.hidden = true;
        passwordForm.hidden = false;
      }
    });
  </script>
</body>
</html>
