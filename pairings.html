<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Weekend Event – Pairings</title>
  <link rel="stylesheet" href="css/site-nav.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <a class="brand" href="index.html">
        <span class="titles">
          <span class="brand-kicker">Narrative map</span>
          <h1>Pairings</h1>
        </span>
      </a>
      <div class="header-end">
        <span id="nav-auth"><a class="nav-login" href="login.html">Log in</a></span>
      </div>
    </div>
    <nav class="site-nav" id="site-menu">
      <a href="index.html">Home</a>
      <a href="area-map.html">Map</a>
      <a href="games.html">Results</a>
      <a href="roster.html">Roster</a>
      <a href="pairings.html">Pairings</a>
      <a href="standings.html">Standings</a>
      <a href="narrative.html">Log</a>
      <a href="map-editor.html" data-role="campaign_admin">Edit map</a>
      <a href="campaign_map.html" data-role="campaign_admin">Node map</a>
      <a href="systems.html" data-role="campaign_admin">Nodes</a>
      <button type="button" id="nav-logout" hidden>Log out</button>
    </nav>
  </header>
  <main class="page">
    <p class="lede">Published games show display name, faction, and army. Drafts stay with the organiser.</p>
    <div id="review" data-role="campaign_admin" hidden class="card form-grid">
      <h2>Review</h2>
      <label class="field">Round
        <select id="round-select"></select>
      </label>
      <label class="field">Seed
        <input id="seed" inputmode="numeric" placeholder="Optional" />
      </label>
      <div class="button-row">
        <button type="button" id="generate">Generate</button>
        <button type="button" class="ghost" id="approve">Approve</button>
        <button type="button" class="ghost" id="publish">Publish</button>
      </div>
      <p id="review-msg" class="msg" role="status"></p>
    </div>
    <div class="button-row" id="sheet-links">
      <a class="button ghost" id="print-round" href="/print/round/1" hidden>Print pairings</a>
      <a class="button ghost" id="print-qr" href="/print/qr-sheet" data-role="campaign_admin" hidden>QR sheet</a>
    </div>
    <div id="list" class="stack" style="margin-top:0.9rem"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/pairings.js"></script>
  <script>SH.applyNavPermissions();</script>
</body>
</html>
