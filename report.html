<!DOCTYPE html>
<html lang="en" data-site-theme="">
<head>
  <script>
    (function () {
      try {
        var site = document.documentElement.getAttribute("data-site-theme") || "current";
        var choice = localStorage.getItem("wem_theme") || "site";
        var theme = choice === "site" ? site : choice;
        if (theme === "journal-tactica") document.documentElement.setAttribute("data-theme", "journal-tactica");
      } catch (e) {}
    })();
  </script>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Weekend Event – Report</title>
  <link rel="stylesheet" href="css/site-nav.css" />
  <link rel="stylesheet" href="css/journal-tactica.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <a class="brand" href="index.html">
        <span class="titles">
          <span class="brand-kicker">Narrative map</span>
          <h1>Report</h1>
        </span>
      </a>
      <div class="header-end">
        <span id="nav-auth"><a class="nav-login" href="login.html">Log in</a></span>
      </div>
    </div>
    <nav class="site-nav" id="site-menu">
      <a href="index.html">Home</a>
      <a href="area-map.html">Map</a>
      <a href="games.html">Results</a>
      <a href="roster.html">Roster</a>
      <a href="pairings.html">Pairings</a>
      <a href="standings.html">Standings</a>
      <a href="narrative.html">Log</a>
      <a href="map-editor.html" data-role="campaign_admin">Edit map</a>
      <a href="campaign_map.html" data-role="campaign_admin">Node map</a>
      <a href="systems.html" data-role="campaign_admin">Nodes</a>
      <button type="button" id="nav-logout" hidden>Log out</button>
    </nav>
  </header>
  <main class="page">
    <p class="lede" id="note">Open this page from the round QR code.</p>
    <form id="report" class="stack" hidden>
      <section class="card">
        <h2>Your table</h2>
        <div id="tables" class="choice-grid"></div>
      </section>
      <section class="card" id="seat-card" hidden>
        <h2>You are</h2>
        <div id="seats" class="choice-grid"></div>
      </section>
      <section class="card" id="score-card" hidden>
        <h2>Result</h2>
        <div id="winner" class="choice-grid">
          <button type="button" class="choice" data-winner="loyalist_win">Loyalist win</button>
          <button type="button" class="choice" data-winner="tie">Tie</button>
          <button type="button" class="choice" data-winner="traitor_win">Traitor win</button>
        </div>
        <div class="two" style="margin-top:0.7rem">
          <label class="field">Loyalist VP
            <input id="loyalist-vp" inputmode="numeric" maxlength="4" />
          </label>
          <label class="field">Traitor VP
            <input id="traitor-vp" inputmode="numeric" maxlength="4" />
          </label>
        </div>
        <label class="field">Note
          <textarea id="note-text" maxlength="240" placeholder="Optional, 240 characters"></textarea>
        </label>
        <button type="submit" id="send">Send report</button>
      </section>
      <p id="msg" class="msg" role="status"></p>
    </form>
  </main>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
  <script>SH.applyNavPermissions();</script>
</body>
</html>
