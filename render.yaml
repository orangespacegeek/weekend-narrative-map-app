# Blueprint for a standalone Render web service.
# Applying this file in the Render dashboard creates a paid service.
# Do not apply it until the cost notes in docs/deploy-render.md have been reviewed.
# This repository does not create the service by itself.

services:
  - type: web
    name: weekend-narrative-map
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: CAMPAIGN_ADMIN_LOGIN
        value: admin
      - key: CAMPAIGN_ADMIN_PASSWORD
        sync: false
    disk:
      name: event-data
      mountPath: /var/data
      sizeGB: 1
