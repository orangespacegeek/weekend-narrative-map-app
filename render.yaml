# Draft only. Do not apply this blueprint.
# Deploy is a later PR. Committing this file does not create a Render service.
# See DEPLOY.md.

services:
  - type: web
    name: weekend-narrative-map
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CAMPAIGN_ADMIN_LOGIN
        value: admin
      - key: CAMPAIGN_ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: event-data
      mountPath: /var/data
      sizeGB: 1
